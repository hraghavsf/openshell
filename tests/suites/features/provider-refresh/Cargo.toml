[package]
name = "provider-refresh"
description = "Features suite: provider credential refresh against a token issuer the gateway reaches on the test host"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/ai-openshell/openshell"
publish = false

[[test]]
name = "provider-refresh"
path = "tests/refresh_handles.rs"
harness = false

[dependencies]
base64 = "0.22"
host-server-support = { path = "../../../support/host-server" }
openshell-testkit = { path = "../../../testkit/testkit" }
prost-types = "0.14"
serde_json = "1"
